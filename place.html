<script>
const P=[
{name:"문래예술촌",cat:"WALK · CULTURE",intro:"철공소의 하루와 예술가의 작업이 한 골목에서 겹쳐지는 문래의 중심 장면.",rating:"—",ratingMeta:"장소 / 개별 공간 운영",addr:"서울 영등포구 도림로128가길 일대",hours:"골목 24H · 개별 공간 상이",price:"무료",img:["https://blog.kakaocdn.net/dna/Ys3yL/dJMcajik3xn/AAAAAAAAAAAAAAAAAAAAAIbP9CgYZwSkfdz4c_L4iT8dTV1SOTUcNWB1gdEwEpuj/img.jpg"],menus:[],editor:"목적지를 찍고 들어가기보다, 간판 하나를 고르고 지그재그로 걸어보세요. 철공소 셔터와 벽화 사이에서 문래의 시간이 가장 잘 보입니다.",source:"골목 사진은 공개 웹 자료를 활용한 편집용 이미지입니다."},
{name:"소문난식당",cat:"EAT · LOCAL NOPO",intro:"김치고등어조림 하나만으로 점심을 만드는 오래된 문래 노포.",rating:"4.5",ratingMeta:"다이닝코드 / 24명 평가",addr:"서울 영등포구 도림로141가길 32-1",hours:"월–토 11:00–16:00 · 일요일 휴무 · 재료 소진 시 조기마감",price:"₩12,000 / 1인",img:["https://d12zq4w4guyljn.cloudfront.net/20211106063755928_photo_eMVHZy4XCitX.jpg","https://d12zq4w4guyljn.cloudfront.net/20251001085927_photo2_0db20df8df42.webp"],menus:[["김치고등어조림","₩12,000"]],editor:"메뉴를 고를 필요가 없다는 게 이 집의 장점. 묵은지와 고등어, 무를 밥에 얹어 먹고 마지막에 숭늉까지. 점심 피크에는 웨이팅을 각오하는 편이 좋습니다.",source:"평점·메뉴·영업정보: 다이닝코드 및 2026년 공개 방문 자료."},
{name:"영일분식",cat:"EAT · NOPO",intro:"철공소 골목에서 반세기 가까이 이어온 칼국수와 칼비빔국수의 집.",rating:"4.1",ratingMeta:"다이닝코드 / 86명 평가",addr:"서울 영등포구 도림로141가길 34-1",hours:"10:00–20:00 · 라스트오더 19:20 · 월요일 휴무",price:"₩4,000–10,000",img:["https://d12zq4w4guyljn.cloudfront.net/750_750_20250917080115_menu1_XLfDdxht9OvI.webp"],menuImage:"https://d12zq4w4guyljn.cloudfront.net/750_750_20250917080115_menu1_XLfDdxht9OvI.webp",menus:[["칼국수","₩10,000"],["칼비빔국수","₩10,000"],["소면","₩10,000"],["소면 비빔국수","₩10,000"],["만두국","₩8,000"],["만두 반판","₩4,000"],["왕만두","₩7,000"]],editor:"처음이라면 칼비빔국수와 칼국수를 나눠 먹는 조합을 추천. 매장 자체가 목적지라기보다 철공소 골목을 걷다가 들어가는 경험까지 포함해보세요.",source:"평점·메뉴·영업정보: 다이닝코드/테이블링."},
{name:"철산장",cat:"EAT · MULLAE CLASSIC",intro:"35년 철공소 공간을 살린 인더스트리얼 식당. 돼지갈비와 평양냉면을 함께.",rating:"4.5",ratingMeta:"다이닝코드 / 11명 평가",addr:"서울 영등포구 경인로77가길 12",hours:"11:30–23:00 · 브레이크 15:00–17:00",price:"₩12,000–19,900+",img:["https://d12zq4w4guyljn.cloudfront.net/750_750_20260420093155600_photo_17effc97349e.webp","https://d12zq4w4guyljn.cloudfront.net/750_750_20251204032820825_menu_7711b4aca86d.webp"],menuImage:"https://d12zq4w4guyljn.cloudfront.net/750_750_20251204032820825_menu_7711b4aca86d.webp",menus:[["한돈 돼지갈비 300g","₩19,900"],["평양랭면","₩12,000"],["비빔냉면","₩12,000"],["들기름냉면","₩12,000"],["평양만두 한 접시","₩12,000"],["평양만두 반 접시","₩6,000"],["곱창전골","₩52,000"]],editor:"문래다운 공간을 원한다면 이곳. 높은 층고와 노출된 질감, 철공소의 흔적을 남긴 공간에서 돼지갈비와 냉면을 같이 즐기는 것이 포인트.",source:"평점·메뉴·영업정보: 다이닝코드."},
{name:"러스트 베이커리",cat:"COFFEE · BAKERY",intro:"철공소의 거친 외관과 빵 냄새가 만나는 문래 대표 베이커리 카페.",rating:"4.0",ratingMeta:"다이닝코드 / 96명 평가",addr:"서울 영등포구 경인로79길 15",hours:"10:30–22:00 · 방문 전 확인 권장",price:"₩3,600–8,000",img:["https://d12zq4w4guyljn.cloudfront.net/750_750_20260320071026174_photo_da8df68f0535.webp","https://d12zq4w4guyljn.cloudfront.net/750_750_20241021125732276_menu_f36ee5025da3.webp"],menus:[["허니버터 크루와상","₩6,000"],["애플파이","₩6,500"],["에그파이","₩6,200"],["티라미수 푸딩","₩7,000"],["퀸아망 얼그레이","₩4,700"],["아메리카노","₩5,500"],["라떼","₩6,000"]],editor:"빵을 고르는 것보다 자리를 고르는 시간이 더 중요할 수도 있습니다. 2층이나 테라스 자리가 있다면 천천히 앉아 문래의 오후를 정리해보세요.",source:"평점·메뉴·영업정보: 다이닝코드/공개 매장 정보."},
{name:"문래방구",cat:"COFFEE · LOCAL FIND",intro:"방구라떼와 커스텀 에스프레소. 메뉴판부터 공간의 캐릭터가 드러나는 작은 카페.",rating:"3.2",ratingMeta:"테이블링 / 리뷰 8건",addr:"서울 영등포구 경인로 763",hours:"월–금 11:30–18:00 · 토–일 12:00–20:00",price:"₩2,500–7,000",img:["https://d12zq4w4guyljn.cloudfront.net/750_750_20250412030443_menu1_791e8b316a24.webp"],menuImage:"https://d12zq4w4guyljn.cloudfront.net/750_750_20231231114447465_menu_f36ee5025da3.webp",menus:[["방구라떼","₩6,000"],["삿포로라떼","₩6,500"],["에스프레소","₩2,500"],["구스토프레소","₩3,000"],["핸드드립","₩6,000"],["커피 푸딩","₩4,500"],["레몬 얼그레이 스콘","₩7,000"]],editor:"여기는 ‘유명한 메뉴’를 찾기보다 메뉴판과 공간을 구경하는 재미로 가는 곳. 오후 코스의 첫 장소로 두면 걷기 전에 리듬을 만들기 좋습니다.",source:"평점·메뉴·영업정보: 테이블링/뽈레."},
{name:"문래근린공원",cat:"WALK · REST",intro:"문래의 골목을 오래 걸은 뒤 잠시 속도를 낮출 수 있는 동네 공원.",rating:"—",ratingMeta:"공원 / 무료",addr:"서울 영등포구 문래동3가 60-2",hours:"24시간",price:"무료",img:["https://ak-d.tripcdn.com/images/1mi72224x90olfzqg202C_R_600_400_R5_Q90.jpg"],menus:[],editor:"카페를 하나 더 넣기보다 여기서 20분 쉬어보세요. 퀘스트의 ‘카페에서 20분 쉬기’를 꼭 채울 필요는 없습니다. 문래는 걷는 동네이니까요.",source:"공원 이미지는 공개 여행 자료를 활용한 편집용 이미지입니다."},
{name:"문래동 꽃밭정원",cat:"WALK · AUTUMN",intro:"철과 식물이 만나는 작은 정원. 문래의 산업 풍경 사이에 계절감을 더하는 장소.",rating:"—",ratingMeta:"공공 공간 / 무료",addr:"서울 영등포구 문래동3가 55-6 일대",hours:"상시 개방",price:"무료",img:["https://mediahub.seoul.go.kr/uploads/mediahub/2024/09/WsvGGfJKaIoVFiBgiubgpjMRSoSQplvh.jpg"],menus:[],editor:"가을 코스에서는 ‘명소’라기보다 장면 전환점으로 쓰세요. 철공소의 회색과 정원의 색이 한 화면에 들어오는 순간을 찾아보는 식입니다.",source:"서울시 공개 자료 기반."},
{name:"은진포차",cat:"EAT · SEASONAL",intro:"제철 해산물을 그날의 메뉴로 만나는 문래의 오래된 실내포차.",rating:"4.2",ratingMeta:"다이닝코드 / 10명 평가",addr:"서울 영등포구 도림로133길 3",hours:"월–목 16:00–23:00 · 금–토 16:00–00:00 · 일 휴무",price:"₩20,000–55,000+",img:["https://www.esquirekorea.co.kr/resources_old/online/org_online_image/eq/721a8a5e-15d6-467f-8810-f757eff2dd15.jpg"],menus:[["병어조림","₩55,000"],["병어 회·무침","₩50,000"],["호래기회","₩40,000"],["열기구이","₩35,000"],["아구수육","₩35,000"],["두루치기","₩20,000"],["돌문어","₩25,000"]],editor:"이곳은 메뉴를 미리 결정하고 가기보다 ‘오늘 뭐가 들어왔는지’를 묻는 게 맞습니다. 가을 저녁이라면 제철 해산물과 소주 한 잔을 코스의 마침표로.",source:"평점·메뉴·영업정보: 다이닝코드/테이블링."},
{name:"올드문래",cat:"NIGHT · BEER",intro:"옛 철공소 장비와 식물이 공존하는 문래의 대표 펍. 하루를 맥주로 닫는 장소.",rating:"4.3",ratingMeta:"다이닝코드 / 66명 평가",addr:"서울 영등포구 도림로 433-6",hours:"11:30–00:00 · 금–토 01:00까지",price:"₩15,000–40,000",img:["https://d2m29rwiahucy3.cloudfront.net/images/store/S191107_1579150718628/1579150862039_10.jpg"],menus:[["매운크림 치킨 파스타","₩23,000"],["바질크림 파스타","₩23,000"],["올드문래 플래터","₩40,000"],["타파스 플래터","₩34,000"],["치즈 플래터","₩30,000"],["먹태구이","₩20,000"],["벨기에 프라이즈","₩15,000"]],editor:"문래의 마지막 장면으로 가장 편하게 쓰기 좋은 곳. 철공소 장비와 식물, 높은 천장이 만드는 공간 자체가 술안주라서 2차를 가볍게 끝내기 좋습니다.",source:"평점·메뉴·영업정보: 다이닝코드."},
{name:"월화갈비",cat:"EAT · DINNER",intro:"마늘폭탄 직화구이와 돼지직화구이. 불향으로 오후를 저녁으로 바꾸는 곳.",rating:"4.9",ratingMeta:"공개 Google 리뷰 자료 / 442건* ",addr:"서울 영등포구 경인로79길 17",hours:"매장 운영시간은 방문 전 확인 권장",price:"₩16,000–18,000+",img:["https://dynamic-media-cdn.tripadvisor.com/media/photo-o/2a/c1/4d/d6/caption.jpg?h=500&s=1&w=900","https://d12zq4w4guyljn.cloudfront.net/750_750_20250311053551_menu1_9d59c50a56ce.webp"],menuImage:"https://d12zq4w4guyljn.cloudfront.net/750_750_20250311053551_menu1_9d59c50a56ce.webp",menus:[["마늘폭탄 직화구이 150g","₩18,000"],["돼지직화구이 150g","₩16,000"],["한우 육회 100g","₩15,000"],["껍데기 180g","₩8,000"],["핫 육회 비빔쫄면","₩10,000"],["깍두기 볶음밥","₩6,000"],["직화 차돌 라면","₩8,000"]],editor:"15시 코스의 마지막에 넣으면 ‘걷기 → 노을 → 불맛’의 대비가 생깁니다. 대표 메뉴인 마늘폭탄 직화구이를 중심으로 2명이 나눠 먹는 구성이 무난합니다.",source:"메뉴: 다이닝코드. 평점은 공개 검색 자료 기준이며 변동 가능."},
{name:"죽변항",cat:"NIGHT · MULLAE +30",intro:"문래의 보행권을 조금 더 확장해 영등포구청 쪽에서 만나는 해산물 저녁.",rating:"4.1",ratingMeta:"테이블링 / 리뷰 13건",addr:"서울 영등포구 국회대로34길 3-2",hours:"월–토 17:00–00:30 · 일요일 휴무",price:"₩25,000–50,000+",img:["https://d12zq4w4guyljn.cloudfront.net/750_750_20251107044503337_photo_2396b69de04a.webp"],menus:[["물회 2인","₩30,000"],["참가자미 2인","₩50,000"],["문어탕 2인","₩35,000"],["홍합탕 2인","₩30,000"],["조개탕 2인","₩25,000"]],editor:"문래 안에서 하루를 끝내는 대신 조금 더 걸을 수 있다면 선택. 17시 이후에만 열기 때문에 AFTER WORK 코스와 궁합이 좋습니다.",source:"평점·메뉴·영업정보: 테이블링."}
];
